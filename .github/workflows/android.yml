# 云端打安卓包，不需要本地装 Android Studio / SDK。
# 触发方式：
# - 推 main：出一个 debug 开发包，放在运行的 Artifacts 里（30 天过期），versionCode 用运行序号。
# - 打 v* 标签（如 v0.1.0）：正式版本，用固定密钥正式签名（密钥存 GitHub Secrets：
#   ENWORDS_KEYSTORE_B64 / ENWORDS_KEYSTORE_PASSWORD）。版本号取自标签（versionName=v 后面的部分，
#   versionCode=major*10000+minor*100+patch，只增不减），APK 附到对应的 GitHub Release 里长期保存。
# - 手动触发（workflow_dispatch）：同推 main。
# 注意：开发包（debug 签名）和正式包（正式签名）签名不同，互相覆盖安装时要先卸载；
# 正式包之间签名相同、versionCode 递增，可以直接覆盖升级。
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖并构建网页版
        run: |
          npm ci
          npm run build

      - name: 决定本包的版本号
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( MA * 10000 + MI * 100 + PA ))
          else
            NAME="$(node -p "require('./package.json').version")-dev"
            CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本包版本：versionName=$NAME versionCode=$CODE"

      - name: 把版本号写进安卓工程
        run: |
          sed -i \
            -e 's/versionCode .*/versionCode ${{ steps.version.outputs.code }}/' \
            -e 's/versionName .*/versionName "${{ steps.version.outputs.name }}"/' \
            android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: 同步网页产物到安卓工程
        run: npx cap sync android

      - name: 解码正式签名密钥（仅标签构建）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ENWORDS_KEYSTORE_B64: ${{ secrets.ENWORDS_KEYSTORE_B64 }}
        run: |
          if [ -z "$ENWORDS_KEYSTORE_B64" ]; then
            echo "缺 GitHub Secret：ENWORDS_KEYSTORE_B64，未配正式签名，停止构建" >&2
            exit 1
          fi
          echo "$ENWORDS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/enwords-release.p12"
          ls -la "$RUNNER_TEMP/enwords-release.p12"

      - name: 打 debug APK（非标签构建）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 打正式签名 APK（标签构建）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ENWORDS_STORE_FILE: ${{ runner.temp }}/enwords-release.p12
          ENWORDS_STORE_PASSWORD: ${{ secrets.ENWORDS_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: APK 按版本改名
        run: |
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$SRC" ] || SRC="android/app/build/outputs/apk/release/app-release.apk"
          cp "$SRC" "en-words-${{ steps.version.outputs.name }}.apk"
          ls -la en-words-*.apk

      - name: 上传 APK（构建产物，30 天）
        uses: actions/upload-artifact@v4
        with:
          name: en-words-${{ steps.version.outputs.name }}-apk
          path: en-words-${{ steps.version.outputs.name }}.apk
          retention-days: 30

      - name: 标签构建时发 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "en-words-${{ steps.version.outputs.name }}.apk" \
            --title "en-words $GITHUB_REF_NAME" \
            --notes "安卓正式签名包（自用）。安装前需允许“安装未知应用”。从 v0.7.3 或更早版本升级时，因签名更换需先卸载旧版（先在设置里导出备份）；v0.7.4 起的版本之间可直接覆盖升级。"
