# 云端打安卓调试包（debug APK），不需要本地装 Android Studio / SDK。
# 触发方式：
# - 推 main：出一个开发包，放在运行的 Artifacts 里（30 天过期），versionCode 用运行序号。
# - 打 v* 标签（如 v0.1.0）：正式版本。版本号取自标签（versionName=v 后面的部分，
#   versionCode=major*10000+minor*100+patch，只增不减），APK 附到对应的 GitHub Release 里长期保存。
# - 手动触发（workflow_dispatch）：同推 main。
# 注意：开发包和正式包的 versionCode 可能互相倒退，安卓不允许低版本覆盖高版本，交叉安装时先卸载旧的。
# debug 包用自动生成的调试签名，只能自用，不能上架应用商店；正式签名留到需要时再配。
name: Android APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖并构建网页版
        run: |
          npm ci
          npm run build

      - name: 决定本包的版本号
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( MA * 10000 + MI * 100 + PA ))
          else
            NAME="$(node -p "require('./package.json').version")-dev"
            CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "本包版本：versionName=$NAME versionCode=$CODE"

      - name: 把版本号写进安卓工程
        run: |
          sed -i \
            -e 's/versionCode .*/versionCode ${{ steps.version.outputs.code }}/' \
            -e 's/versionName .*/versionName "${{ steps.version.outputs.name }}"/' \
            android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: 同步网页产物到安卓工程
        run: npx cap sync android

      - name: 打 debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: APK 按版本改名
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "en-words-${{ steps.version.outputs.name }}.apk"
          ls -la en-words-*.apk

      - name: 上传 APK（构建产物，30 天）
        uses: actions/upload-artifact@v4
        with:
          name: en-words-${{ steps.version.outputs.name }}-apk
          path: en-words-${{ steps.version.outputs.name }}.apk
          retention-days: 30

      - name: 标签构建时发 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "en-words-${{ steps.version.outputs.name }}.apk" \
            --title "en-words $GITHUB_REF_NAME" \
            --notes "安卓调试包（debug 签名，自用）。安装前需允许“安装未知应用”。"
